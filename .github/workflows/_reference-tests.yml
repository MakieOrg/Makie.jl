name: Reference tests
on:
  workflow_call:

jobs:
  cairomakie:
    uses: ./.github/workflows/_cairomakie.yml

  glmakie:
    uses: ./.github/workflows/_glmakie.yml

  wglmakie:
    uses: ./.github/workflows/_wglmakie.yml

  consolidation:
    name: Merge artifacts
    runs-on: ubuntu-latest
    if: always()
    needs: [cairomakie, glmakie, wglmakie]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # WGLMakie now tests Julia 1.11 + 1.12 (Bonito v5 needs >=1.11); use the
          # latest (1.12), which is what the old '1' resolved to.
          name: ReferenceImages_WGLMakie_1.12
          path: ./ReferenceImages/WGLMakie
      - uses: actions/download-artifact@v8
        with:
          name: ReferenceImages_CairoMakie_1
          path: ./ReferenceImages/CairoMakie
      - uses: actions/download-artifact@v8
        with:
          name: ReferenceImages_GLMakie_1
          path: ./ReferenceImages/GLMakie
      - name: Consolidate reference image folders
        run: |
          baseDir="./ReferenceImages"

          # Create new top-level directory for combined files
          mkdir -p "./ReferenceImagesCombined"

          # Copy the reference folder from GLMakie, it's the same for all backends
          cp -r "${baseDir}/GLMakie/reference/." "./ReferenceImagesCombined/reference/"

          # Initialize empty files for concatenation
          > "./ReferenceImagesCombined/scores.tsv"
          > "./ReferenceImagesCombined/new_files.txt"

          # Loop through the directories and concatenate the files, and copy recorded folders
          for dir in WGLMakie CairoMakie GLMakie; do
              # Concatenate scores.tsv, new_files.txt, missing_files.txt and failed_recordings.txt
              cat "${baseDir}/${dir}/scores.tsv" >> "./ReferenceImagesCombined/scores.tsv"
              cat "${baseDir}/${dir}/new_files.txt" >> "./ReferenceImagesCombined/new_files.txt"
              cat "${baseDir}/${dir}/missing_files.txt" >> "./ReferenceImagesCombined/missing_files.txt"
              cat "${baseDir}/${dir}/failed_recordings.txt" >> "./ReferenceImagesCombined/failed_recordings.txt"

              # Copy recorded folder
              mkdir -p "./ReferenceImagesCombined/recorded/${dir}/"
              cp -r "${baseDir}/${dir}/recorded/${dir}/." "./ReferenceImagesCombined/recorded/${dir}/"
          done

          # Bundle the update manifest so the per-PR review page build is self-contained
          cp -r ReferenceTests/refimage_updates "./ReferenceImagesCombined/refimage_updates"

          echo "Files and folders have been successfully combined into ReferenceImagesCombined."
      - uses: actions/upload-artifact@v7
        with:
          name: ReferenceImages
          path: ./ReferenceImagesCombined/
      - name: Save number of missing refimages to file
        env:
          COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ./n_missing
          N_MISSING=$(wc -l < ./ReferenceImagesCombined/new_files.txt)
          echo $N_MISSING > ./n_missing/n_missing_refimages
          echo $COMMIT_SHA >> ./n_missing/n_missing_refimages
      - name: Upload artifact with number of missing refimages
        uses: actions/upload-artifact@v7
        with:
          name: n_missing_refimages
          path: n_missing/

  refimage-status:
    name: Reference image status
    runs-on: ubuntu-latest
    needs: [consolidation]
    if: always() && needs.consolidation.result == 'success'
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: n_missing_refimages
      - name: Check for missing reference images
        run: |
          N_MISSING=$(head -1 n_missing_refimages)
          echo "$N_MISSING missing reference image(s)"
          if [ "$N_MISSING" -ne 0 ]; then
            echo "::error::$N_MISSING missing reference image(s) must be uploaded"
            exit 1
          fi

  review-page:
    name: Reference image review page
    runs-on: ubuntu-latest
    needs: [consolidation]
    if: always() && needs.consolidation.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ReferenceImages
          path: ./reference_images_data
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Install Julia dependencies
        run: julia --project=reference_images_site -e 'using Pkg; Pkg.instantiate()'
      - name: Build self-contained review page
        id: build
        run: julia --project=reference_images_site reference_images_site/build_review.jl
      - name: Upload review page (unzipped, viewable directly in the browser)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: reference-image-review
          path: reference_images_site/review/index.html
          archive: false
      # The commit status is posted by refimage-status.yml (workflow_run), because
      # fork PRs only get a read-only token here and cannot write statuses.
      - name: Save status data for the chained status workflow
        env:
          STATE: ${{ steps.build.outputs.state }}
          DESCRIPTION: ${{ steps.build.outputs.description }}
          REVIEW_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: >
          jq -n --arg state "$STATE" --arg description "$DESCRIPTION" --argjson review_artifact_id "$REVIEW_ARTIFACT_ID"
          '{state: $state, description: $description, review_artifact_id: $review_artifact_id}' > refimage_status.json
      - name: Upload status data
        uses: actions/upload-artifact@v7
        with:
          name: refimage_status
          path: refimage_status.json
