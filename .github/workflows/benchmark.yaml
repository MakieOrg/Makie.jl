# EXPERIMENT: /benchmark stubbed out for fast iteration on the Check Runs UI.
# Generates placeholder SVGs instead of running the real TTFP benchmark, then
# publishes them as a check run on the PR head SHA with output.images. No PR
# comment. Restore the real benchmark before merging.
name: Benchmark
on:
  workflow_call:
    inputs:
      comment_body:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
    secrets:
      BENCHMARK_KEY:
        required: false

jobs:
  start:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      check_id: ${{ steps.create.outputs.check_id }}
    steps:
      - name: Create in-progress check run
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          id=$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/check-runs" \
            -f "name=Benchmark" \
            -f "head_sha=$HEAD_SHA" \
            -f "status=in_progress" \
            -f "details_url=$RUN_URL" \
            -f "output[title]=Benchmark" \
            -f "output[summary]=Running…" \
            --jq '.id')
          echo "check_id=$id" >> "$GITHUB_OUTPUT"

  fake-bench:
    needs: start
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Generate placeholder SVGs
        run: |
          set -euo pipefail
          mkdir -p ./images
          for pkg in CairoMakie GLMakie WGLMakie; do
            cat > "./images/$pkg.svg" <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
            <rect width="800" height="400" fill="#f5f5f5"/>
            <text x="400" y="180" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#222">$pkg placeholder</text>
            <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">SHA ${{ inputs.head_sha }}</text>
          </svg>
          EOF
          done

      - name: Check token validity
        id: check_token
        env:
          BENCHMARK_KEY: ${{ secrets.BENCHMARK_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BENCHMARK_KEY" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create gist with images
        if: steps.check_token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.BENCHMARK_KEY }}
        run: |
          set -euo pipefail
          gist_url=$(gh gist create ./images/CairoMakie.svg ./images/GLMakie.svg ./images/WGLMakie.svg | grep -Eo 'https://gist.github.com[/a-zA-Z0-9]+')
          echo "GIST_URL=$gist_url" >> "$GITHUB_ENV"
          echo "GIST_RAW=$(echo "$gist_url" | sed 's|github|githubusercontent|')/raw" >> "$GITHUB_ENV"

      - name: Publish results as check run
        if: steps.check_token.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ needs.start.outputs.check_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          summary="**SHA** [\`${HEAD_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${HEAD_SHA}) · placeholder run

          > [!WARNING]
          > CI runners are noisy; treat results with caution."
          jq -n \
            --arg summary "$summary" \
            --arg cairo "$GIST_RAW/CairoMakie.svg" \
            --arg gl    "$GIST_RAW/GLMakie.svg" \
            --arg wgl   "$GIST_RAW/WGLMakie.svg" \
            '{
              status: "completed",
              conclusion: "success",
              output: {
                title: "Benchmark Results",
                summary: $summary,
                images: [
                  {alt: "CairoMakie", image_url: $cairo, caption: "CairoMakie"},
                  {alt: "GLMakie",    image_url: $gl,    caption: "GLMakie"},
                  {alt: "WGLMakie",   image_url: $wgl,   caption: "WGLMakie"}
                ]
              }
            }' | gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/check-runs/$CHECK_ID" \
              --input -

  finalize:
    needs: [start, fake-bench]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Mark check run failed
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ needs.start.outputs.check_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/check-runs/$CHECK_ID" \
            -f "status=completed" \
            -f "conclusion=failure" \
            -f "output[title]=Benchmark failed" \
            -f "output[summary]=See the Actions run for details."
