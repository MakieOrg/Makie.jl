name: RayMakie Lavapipe

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - sd/lava-refactor

concurrency:
  group: raymakie-lavapipe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: RayMakie / Lavapipe_jll
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display and OpenGL software driver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Resolve published backend dependencies
        run: julia --project=RayMakie/.ci -e 'using Pkg; Pkg.instantiate()'
      - name: Inspect software OpenGL
        run: LIBGL_ALWAYS_SOFTWARE=true xvfb-run -a glxinfo -B
      - name: Run RayMakie tests
        env:
          RAYMAKIE_TEST_LAVAPIPE: 'true'
          LIBGL_ALWAYS_SOFTWARE: 'true'
          RAYMAKIE_RASTER_DIAGNOSTICS: ${{ runner.temp }}/raymakie-raster
        run: xvfb-run -a julia --project=RayMakie/.ci -e 'using Pkg; Pkg.test("RayMakie"; allow_reresolve = false, test_args = ["test_mesh_raster.jl"], julia_args = `--check-bounds=auto`)'
      - name: Save raster diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raster-comparison
          path: ${{ runner.temp }}/raymakie-raster
