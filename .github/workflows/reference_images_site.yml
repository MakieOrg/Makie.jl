name: Reference Images Site

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to build site for'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    # Only run if the workflow run was successful or if manually triggered
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v3

      - name: Get PR number
        id: pr_number
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "pr=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
          else
            echo "pr=${{ github.event.workflow_run.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Download ReferenceImages artifact
        if: steps.pr_number.outputs.pr != ''
        uses: actions/download-artifact@v8
        with:
          name: ReferenceImages
          path: ./reference_images_data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install Julia dependencies
        run: julia --project=reference_images_site -e 'using Pkg; Pkg.instantiate()'
      - name: Build static site
        id: build
        if: steps.pr_number.outputs.pr != ''
        env:
          PR_NUMBER: ${{ steps.pr_number.outputs.pr }}
        run: julia --project=reference_images_site reference_images_site/build_site.jl
      - name: Post reference images status
        if: github.event_name == 'workflow_run' && steps.pr_number.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PR: ${{ steps.pr_number.outputs.pr }}
          STATE: ${{ steps.build.outputs.state }}
          N_CHANGED: ${{ steps.build.outputs.n_changed }}
          N_APPROVED: ${{ steps.build.outputs.n_approved }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context="reference images" \
            -f target_url="https://docs.makie.org/reference_images/PR${PR}/" \
            -f description="$N_APPROVED/$N_CHANGED new/changed images approved via manifest"
